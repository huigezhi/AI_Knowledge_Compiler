<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AKC · Side Panel</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">AKC</div>
      <a class="link" href="../options/index.html" target="_blank">设置</a>
    </header>

    <section class="card" id="provider-card">
      <div class="row">
        <span class="label">平台</span>
        <span id="provider-name" class="value">检测中…</span>
      </div>
      <div class="row">
        <span class="label">当前会话</span>
        <span id="conversation-title" class="value">—</span>
      </div>
      <div class="row">
        <span class="label">适配器</span>
        <span id="adapter-health" class="value">—</span>
      </div>
      <div class="row">
        <span class="label">自动保存</span>
        <span id="autosave-status" class="value">—</span>
      </div>
    </section>

    <section class="card">
      <div class="actions">
        <button id="btn-save" class="primary">保存当前</button>
        <button id="btn-save-compile">保存 + 编译</button>
        <button id="btn-health" class="ghost">健康检查</button>
      </div>
      <p id="health-result" class="hint">「健康检查」会依次检查后端服务、Obsidian 库、AI 编译配置与当前页面适配器。</p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>历史会话</h2>
        <button id="btn-load-history" class="ghost">加载</button>
      </div>
      <div class="actions">
        <button id="btn-crawl" class="primary">自动同步历史</button>
        <button id="btn-crawl-cancel" class="ghost" hidden>取消</button>
      </div>
      <p class="hint">
        「自动同步历史」在<strong>后台静默读取</strong>未采集的历史会话：不跳转页面、
        不干扰你当前的操作。已入库的自动跳过，单条失败最多重试一次，连续失败会主动停止。
      </p>
      <div id="crawl-progress" class="muted"></div>
      <ul id="history-list" class="history"></ul>
      <p id="sync-status" class="muted"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>编译结果</h2>
        <button id="btn-write-obsidian" class="ghost">写入全部</button>
      </div>
      <div id="compile-summary" class="stats">
        <span>识别 <b id="stat-items">0</b> 个知识</span>
        <span>待审核 <b id="stat-review">0</b></span>
        <span>已入库 <b id="stat-created">0</b></span>
      </div>
      <div id="job-stage" class="muted"></div>
      <div class="actions">
        <button id="btn-write-current" class="primary" disabled>一键写入 Obsidian</button>
      </div>
      <p id="write-target" class="hint">先「保存 + 编译」一次，这里即可把本次结果一键写入 Obsidian。</p>
      <ul id="knowledge-list" class="knowledge"></ul>
    </section>

    <div id="error-banner" class="banner" hidden>
      <span id="error-text"></span>
      <button id="btn-retry" class="ghost">重试</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
